<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../homepage/details.css" />
  <script src="../homepage/user.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="../homepage/homepage.html" class="back-arrow">←</a>
      <h1>Profile</h1>
    </div>

    <div class="profile-card">
      <div class="profile-left">
        <img src="../assets/business_logo.jpg" alt="Water Logo" class="profile-logo" />
      </div>

      <div class="profile-right">
        <p><strong>Name:</strong></p>
        <p><strong>Address:</strong></p>
        <p><strong>Contact No:</strong></p>
        <p><strong>Store Name:</strong></p>
        <button class="edit-btn">Edit</button>
      </div>
    </div>

    <div class="feedback-section">
      <h2>Feedback</h2>
      <textarea placeholder="Feedback about the system:"></textarea>
      <button class="submit-btn">Submit</button>
    </div>
  </div>
</body>
</html>
