<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroWeb Jasaan | Dashboard</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../homepage/homepage.css">
  <script src="../homepage/user.js" defer></script>
  <script src="../homepage/history.js" defer></script>
  <script src="../logout/logout.js" defer></script>
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="../assets/logo.png" alt="HydroWeb Jasaan Logo">
      </div>

      <nav class="nav">
        <a href="../homepage/homepage.html" ><i>🏠</i> Dashboard</a>
        <a href="../homepage/sales.html" id="salesLink"><i>📊</i> Sales Management</a>
        <a href="../homepage/inventory.html"><i>📦</i> Inventory Management</a>
        <a href="../homepage/delivery.html"><i>🚚</i> Delivery Management</a>
        <a href="../homepage/price.html"><i>🏷️</i>Price Management</a>
        <a class="active" href="#"><i>📜</i> History</a>
        <a href="../homepage/report.html"><i>📈</i>Sales Report</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header-banner">
        <h2 id="welcomeText">Welcome to HydroWeb Jasaan!</h2>
        <a class="user-icon">👤</a>
        <div id="user-menu" class="hidden">
          <button class="menu-button" onclick="window.location.href='../homepage/details.html'">Personal Details</button>
          <button class="menu-button" onclick="window.location.href='#'">Settings</button>
          <button class="menu-button" onclick="logoutUser()">Log Out</button>
        </div>
      </header>

      <!-- History Cards -->
       <section class="content-section">


        <h3>History Track</h3>

        <div class="hcard-container">
          <div class="hcard blue">
            <div class="hcard-content">
              <i class="ic">📈</i>
              <h4>Sales Records</h4>
            </div>
            <i class="fa-solid fa-arrow-right arrow"></i>
          </div>

          <div class="hcard green" id="inventoryHistoryCard">
            <div class="hcard-content">
              <i class="ic">🧴</i>
              <h4>Inventory Records</h4>
            </div>
            <i class="fa-solid fa-arrow-right arrow"></i>
          </div>

          <div class="hcard yellow">
            <div class="hcard-content">
              <i class="ic">🚚</i>
              <h4>Delivery Records</h4>
            </div>
            <i class="fa-solid fa-arrow-right arrow"></i>
          </div>

          <div class="hcard darkblue" id="waterReserveCard">
            <div class="hcard-content">
              <i class="ic">💧</i>
              <h4>Water Reserve Records</h4>
            </div>
            <i class="fa-solid fa-arrow-right arrow"></i>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Sale History Modal -->
  <div class="saleHistory fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="modal-content bg-white rounded-lg shadow-lg p-4 w-11/12 max-w-3xl overflow-auto">
      <p class="text-gray-500 text-center">Loading...</p>
    </div>
  </div>
  
</body>
</html>
