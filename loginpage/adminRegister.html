<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../loginpage/register.css"/>
  <script src="../loginpage/register.js" defer></script>
</head>
<body>

  <div class="register-container">
    <img src="../assets/logo.png" alt="HydroWeb Logo" class="logo" />
    <p class="title">Business Account</p>

    <form class="register-form" method="POST" action="../loginpage/adminRegisterAcc.php">
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="text" name="shopname" placeholder="Refilling Store Name" required />
      <input type="text" name="contactno" placeholder="Contact" id="contactno" required />
      <input type="text" name="business_address" placeholder="Business Address" required />

      <!-- Added Email -->
      <input type="email" name="email" placeholder="Email Address" required />

      <input type="text" name="username" placeholder="Username" required />

      <!-- Added Opening Time -->
      <label style="font-size: 14px; margin-top: 5px;">Opening Time</label>
      <input type="time" name="opening_time" required />

      <!-- Added Closing Time -->
      <label style="font-size: 14px; margin-top: 5px;">Closing Time</label>
      <input type="time" name="closing_time" required />

      <div class="password-container">
        <input type="password" name="password" placeholder="Password" required />
        <span class="toggle-password">👁️</span>
      </div>

      <div class="password-container">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required />
        <span class="toggle-password">👁️</span>
      </div>

      <button type="submit" class="signup-btn">Sign Up</button>
      <a href="index.html" class="login-link">Already have an account?</a>
    </form>
  </div>

  <script>
    // Password toggle feature
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', function() {
        const input = this.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });
  </script>

</body>
</html>
