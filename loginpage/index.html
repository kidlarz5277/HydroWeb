<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-container">
    <!-- LOGIN FORM -->
    <form class="login-form" method="POST" action="../loginpage/login.php" id="loginForm">
      <img src="../assets/logo.png" alt="HydroWeb Jasaan Logo" class="logo" />

      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />

      <button type="submit">Log In</button>
      <a href="#" class="forgot-password">Forgot Password?</a>
      <button type="button" class="create-account" id="createAccountBtn">Create Account</button>
    </form>

    <!-- ACCOUNT TYPE SELECTION -->
    <div class="account-type-container" id="accountTypeContainer">
      <h2>Select Account Type</h2>
      <button class="account-btn customer-btn">Customer</button>
      <button class="account-btn business-btn">Business Owner</button>
      <button class="back-btn" id="backBtn">Back to Login</button>
    </div>
  </div>

  <script src="../loginpage/login.js"></script>
</body>
</html>
