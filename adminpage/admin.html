<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../adminpage/admin.css">
  <script src="../adminpage/adminDashboard.js" defer></script>
  <script src="../logout/logout.js" defer></script>
</head>
<body>

  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="../assets/logo.png" alt="HydroWeb Jasaan Logo">
      </div>

      <nav class="nav">
        <a href="#" class="active"><i>🏠</i> Dashboard</a>
        <a href="../adminpage/userManage.html"><i>👥</i> Admin User Management</a>
        <a href="../adminpage/prodManage.html"><i>📦</i>Product Management</a>
        <a href="../adminpage/waterTypeManage.html"><i>💧</i> Water Type Management</a>
        <a href="../adminpage/waterSizeManage.html"><i>🧪</i> Water Size Management</a>
        <a href="../adminpage/viewFeedback.html"><i>💬</i>Feedback Management</a>
        <a onclick="logoutUser()"><i>🚪</i> Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header-banner">
        <h2>Welcome to HydroWeb Jasaan!</h2>
      </header>

      <!-- Dashboard Cards -->
      <section class="dashboard-cards">

        <div class="card blue" onclick="window.location.href='../adminpage/userManage.html'">
          <div class="card-icon">👥</div>
          <h3>Pending Admin Users</h3>
          <p id="pendingAdmins">0</p>
        </div>

        <div class="card green" onclick="window.location.href='../adminpage/prodManage.html'">
          <div class="card-icon">🧴</div>
          <h3>Current Containers</h3>
          <p id="containerCount">0</p>
        </div>

        <div class="card yellow" onclick="window.location.href='../adminpage/viewFeedback.html'">
          <div class="card-icon">💬</div>
          <h3>New Feedbacks</h3>
          <p id="newFeedbacks">0</p>
        </div>

        <div class="card darkblue" onclick="window.location.href='../adminpage/waterTypeManage.html'">
          <div class="card-icon">💧</div>
          <h3>Current Water Types</h3>
          <p id="waterTypes">0</p>
        </div>
      </section>

      </section>
    </main>
  </div>

</body>
</html>
