<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Details | HydroWeb Jasaan</title>

<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="../customerspage/editDetails.js" defer></script>

<style>
:root {
  --blue-dark: #005b8f;
  --blue-mid: #0077a3;
  --blue-light: #b5e8fa;
  --card-bg: rgba(255, 255, 255, 0.35);
  --text-dark: #053b5e;
  --accent: #00a8e8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #0e87c9, #0077A3, #b5e8fa);
  min-height: 100vh;
  color: var(--text-dark);
}

/* Header */
.topbar {
  background: rgba(0, 91, 143, 0.9);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 15px 25px;
  display: flex;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 120px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 100;
}

.back-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  margin-right: 15px;
  cursor: pointer;
}

.header-title h1 {
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(90deg, #77d4f7, #d0eef7, #3a90f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Main Content */
.main-content {
  margin-top: 100px;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.details-container {
  background: rgb(179, 217, 246);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 35px 30px;
  max-width: 600px;
  width: 100%;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
  margin-top: 40px;
}

.details-container h2 {
  color: var(--blue-dark);
  font-size: 22px;
  margin-bottom: 25px;
  border-bottom: 2px solid var(--blue-light);
  padding-bottom: 8px;
}

.detail-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: 600;
  color: var(--blue-dark);
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

input[readonly] {
  background: #f4f8fb;
  cursor: not-allowed;
}

.btn-group {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

button {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
  padding: 10px 20px;
  color: #fff;
}

.edit-btn {
  background: linear-gradient(90deg, #0096c7, #00b4d8);
}

.save-btn {
  background: linear-gradient(90deg, #0077a3, #0096c7);
}

.cancel-btn {
  background: #ef5350;
}

button:hover {
  opacity: 0.9;
}

.hidden {
  display: none;
}

@media (max-width: 600px) {
  .details-container {
    padding: 25px 20px;
  }

  .header-title h1 {
    font-size: 20px;
  }

  button {
    width: 100%;
  }

  .btn-group {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="window.location.href='../customerspage/index.html'">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div class="header-title">
    <h1>Personal Details</h1>
  </div>
</div>

<div class="main-content">
  <div class="details-container">
    <h2>Your Information</h2>

    <div class="detail-group">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" readonly>
    </div>

    <div class="detail-group">
      <label for="contact">Contact</label>
      <input type="text" id="contact" readonly>
    </div>

    <div class="detail-group">
      <label for="address">Address</label>
      <input type="text" id="address" readonly>
    </div>

    <div class="btn-group" id="defaultButtons">
      <button class="edit-btn" id="editBtn"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
    </div>

    <div class="btn-group hidden" id="editButtons">
      <button class="save-btn" id="saveBtn"><i class="fa-solid fa-check"></i> Save</button>
      <button class="cancel-btn" id="cancelBtn"><i class="fa-solid fa-xmark"></i> Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
