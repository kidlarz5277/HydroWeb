<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HydroWeb Jasaan Dashboard</title>

<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Notification & other custom CSS -->
<link rel="stylesheet" href="../customerspage/notif.css">

<script src="../customerspage/user_icon.js" defer></script>
<script src="../customerspage/admin.js" defer></script>
<script src="../logout/logout.js" defer></script>

<style>
  :root {
    --blue-dark: #005b8f;
    --blue-light: #c8f1ff;
    --card-bg: #053b5e;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    display: flex;
    background-color: #f4f9fc;
    background: linear-gradient(135deg, #0e87c9, #0077A3, #b5e8fa);
  }

  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 220px;
    height: 100vh;
    background-color: var(--blue-light);
    padding-top: 20px;
    overflow-y: auto;
    z-index: 1000;
  }

  .sidebar h2 {
    text-align: center;
    color: var(--blue-dark);
    margin-bottom: 30px;
  }

  .sidebar a {
    display: block;
    padding: 15px 20px;
    color: #000;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .sidebar a:hover,
  .sidebar a.active {
    background-color: var(--blue-dark);
    color: #fff;
  }

  /* Main */
  .main-content {
    flex-grow: 1;
    margin-left: 220px;
    margin-top: 120px;
    padding: 20px;
  }

  /* Topbar */
  .topbar {
    background-color: var(--blue-dark);
    color: #fff;
    padding: 10px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 120px;
    gap: 12px;
    position: fixed;
    top: 0;
    left: 220px;
    right: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-title {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .header-title h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    display: inline-block;
    background: linear-gradient(90deg,#77d4f7, #d0eef7, #2678db);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  .header-title h1 span {
    color: #ffffff;
  }

  .header-title p {
    font-size: 13px;
    color: #b3e8ff;
    font-weight: 400;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .topbar-left img {
    height: 80px;
    width: auto;
    object-fit: contain;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
  }

  .topbar-right i {
    font-size: 22px;
    background-color: #0077b6;
    padding: 10px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
  }

  .topbar-right i:hover {
    background-color: #0096c7;
  }

  /* Dropdown Menu */
  .dropdown {
    position: absolute;
    top: 70px;
    right: 25px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    width: 220px;
    overflow: hidden;
    display: none;
    flex-direction: column;
    z-index: 100;
    border: 1px solid #e5e5e5;
    transition: all 0.25s ease;
  }

  .dropdown a {
    padding: 12px 18px;
    text-decoration: none;
    color: #222;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.25s ease;
  }

  .dropdown a i {
    font-size: 18px;
    color: #333;
    background: none;
    border: none;
    padding: 0;
    width: 22px;
    text-align: center;
    transition: color 0.25s ease;
  }

  .dropdown a:hover {
    background-color: #f3fbff;
    color: var(--blue-dark);
  }

  .dropdown a:hover i {
    color: var(--blue-dark);
  }

  .dropdown .logout:hover {
    background-color: #fdecea;
    color: #c62828;
  }

  .dropdown .logout:hover i {
    color: #c62828;
  }

  .dropdown a span {
    flex: 1;
  }

  .dropdown .divider {
    height: 1px;
    background-color: #eaeaea;
    margin: 4px 0;
  }

  .dashboard-content {
    padding: 40px;
  }

  .dashboard-content h2 {
    text-align: center;
    margin-top: -20px;
    margin-bottom: 35px;
    color: #fff;
  }

  .station-link {
    text-decoration: none;
    display: block;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .station-link:hover .station-card {
    transform: translateY(-5px);
    box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.25),
                0 0 15px rgba(0, 119, 182, 0.4);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .station-card {
    display: flex;
    align-items: center;
    background-color: var(--card-bg);
    color: white;
    border-radius: 12px;
    padding: 15px 20px;
    margin: 0 auto 20px auto;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    width: 95%;
    max-width: 1100px;
    transition: all 0.25s ease;
  }

  .station-card img {
    width: 100px;
    height: 100px;
    margin-right: 20px;
    border-radius: 50%;
    background-color: #0077b6;
    padding: 5px;
  }

  .station-info h3 {
    margin-bottom: 5px;
    font-size: 18px;
  }

  .station-info p {
    font-size: 14px;
  }

  .station-info b {
    color: #b3e8ff;
  }

  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }

  .status-open {
      background-color: #28a745;
  }

  .status-closed {
      background-color: #dc3545;
  }

  .disabled-card {
      cursor: not-allowed;
  }
</style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <img src="../assets/logo.png" alt="Logo" style="height:100px; display:block; margin:auto; width:auto;">
    </div>
    <a href="../customerspage/index.html" class="active">Dashboard</a>
    <a href="../customerspage/RequestDelivery.html">Request Delivery</a>
    <a href="../customerspage/DeliveredHistory.html">Delivered History</a>
  </div>

  <!-- Main -->
  <div class="main-content">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="header-title">
          <h1>Welcome, <span id="customerName">HydroWeb Jasaan</span></h1>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Notification Bell -->
        <div id="notifBell">
          <i class="fa-solid fa-bell"></i>
          <span id="notifCount">0</span>
        </div>

        <div class="dropdown" id="notifDropdown">
          <div id="notifList">
            <!-- Notifications will be loaded here -->
          </div>
        </div>

        <!-- User Icon -->
        <i class="fa-solid fa-user" id="userIcon"></i>

        <div class="dropdown" id="userDropdown">
          <a href="PersonalDetails.html">
            <i class="fa-solid fa-user"></i>
            <span>Personal Details</span>
          </a>

          <a href="../customerspage/settings.html">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </a>

          <div class="divider"></div>

          <a onclick="logoutUser()" class="logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard-content">
    </div>
  </div>
</body>
</html>
